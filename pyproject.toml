# Type checking setup. Run from the repo root:
#
#   .venv/Scripts/python -m mypy
#
# disallow_untyped_defs makes mypy complain about any function without type hints.

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["crag"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

# sentence_transformers ships no type information, and transformers' type hints are
# incomplete (e.g. generate() and apply_chat_template() confuse mypy). Treat both as
# untyped, so our own code is checked but calls into them are not.
[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*", "transformers", "transformers.*", "scipy", "scipy.*"]
ignore_missing_imports = true
follow_imports = "skip"
